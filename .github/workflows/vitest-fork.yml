name: Vitest Fork Verify 177

on:
  push:
    branches:
      - ci/vitest-verify-177

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --legacy-peer-deps
      - run: npx vitest run tests/contracts/v3_dev_fee_177.test.ts tests/contracts/withdraw_funds.test.ts
