name: Vitest Fork Verify 177
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --legacy-peer-deps
      - name: Diagnose Lifecycle
        run: |
          echo '### submit.ts tail' >> $GITHUB_STEP_SUMMARY
          echo '```ts' >> $GITHUB_STEP_SUMMARY
          tail -n 65 src/lib/ergo/actions/submit.ts >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '### Quick Diagnostic Run' >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          node -e 'const fs=require("fs");let s=fs.readFileSync("src/lib/ergo/fetch.ts","utf8");const orig=s;s=s.replace(/return null;/g,(m,off)=>"{ console.log(\"NULL_LINE_\"+orig.slice(0,off).split(\"\\n\").length); return null; }");fs.writeFileSync("src/lib/ergo/fetch.ts",s);'
          npx vitest run tests/contracts/v3_full_lifecycle_integration.test.ts --no-color 2>&1 | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
